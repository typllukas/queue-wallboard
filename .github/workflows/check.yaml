name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make up
      - name: Lock files match the manifests
        run: git diff --exit-code -- web/package-lock.json backend/composer.lock
      - run: make check
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
